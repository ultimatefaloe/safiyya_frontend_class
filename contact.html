<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Portfolio</title>
    <link rel="shortcut icon" href="./images/logo.png" type="image/x-icon" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/contact.css">
  </head>
  <body>
    <!-- header section -->
    <header class="center-content">
      <div class="max-width head-section">
        <!-- brand -->
        <a href="./index.html">
          <h1>Safiyya Folio</h1>
        </a>

        <!-- navigation links -->
        <nav>
          <ul>
            <li><a href="./index.html">Home</a></li>
            <li><a href="./project.html">Project</a></li>
            <li><a href="./blog.html">Blog</a></li>
            <li><a href="./contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- main section -->
    <main class="center-content">
      <!-- contact section -->
      <section class="max-width contact-content">
        <div class="container">
          <h1 class="title">Get In Touch</h1>
          <p>
            Have a project in mind? Fill in the form and I will get back to you.
          </p>

          <!-- form section -->
          <form action="">
            <div class="input-group">
              <label for="name">Full Name: <span>*</span></label>
              <input type="text" name="name" id="name" placeholder="e.g Safiyya" required>
            </div>

            <div class="input-group">
              <label for="email">Email Address: <span>*</span></label>
              <input type="email" name="emal" id="email" placeholder="example@gmail.com" required>
            </div>

            <div class="input-group">
              <label for="service">Service Needed: </label>
              <select id="service" name="service">
                <option value="">-- Choose a service</option>
                <option value="web-design">Web Design</option>
                <option value="web-app">Web Application</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="input-group">
              <label for="message">Message: <span>*</span></label>
              <textarea name="message" id="message" placeholder="Tell me about your project..."></textarea>
            </div>

            <div class="cta">
              <button type="submit" class="btn w-full">Send Message</button>
            </div>

          </form>
          
        </div>
      </section>
    </main>
  </body>
</html>
